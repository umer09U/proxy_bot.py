name: Post Proxy To Telegram

on:
  schedule:
    # Har 30 minute baad chalega (GitHub free cron ka practical minimum ~15-20 min hai;
    # zyada tight schedule GitHub khud throttle/delay kar deta hai)
    - cron: "*/30 * * * *"
  workflow_dispatch: {}   # Manually bhi "Run workflow" button se chala sakte hain

jobs:
  post-proxy:
    runs-on: ubuntu-latest
    steps:
      - name: Repo checkout karo
        uses: actions/checkout@v4

      - name: Python setup karo
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencies install karo
        run: pip install -r requirements.txt

      - name: Bot chalao
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python proxy_bot.py

      - name: posted_proxies.json wapas repo me commit karo
        run: |
          git config user.name "proxy-bot"
          git config user.email "proxy-bot@users.noreply.github.com"
          git add posted_proxies.json
          git diff --staged --quiet || git commit -m "Update posted proxies list"
          git push
